name: CI

# Reusable CI pipeline for every buildable damian1000 repo. Callers reduce to a
# `uses:` one-liner and pass only what genuinely differs (coverage/report paths).
# Everything uniform — the Claude-attribution history gate, toolchain setup,
# Spotless, the coverage-gated build, Codecov, the test-report artifact — lives
# here, defined once.
on:
  workflow_call:
    inputs:
      coverage-report-files:
        description: Comma-separated JaCoCo XML report path(s) uploaded to Codecov.
        type: string
        default: build/reports/jacoco/test/jacocoTestReport.xml
      test-report-paths:
        description: Test HTML report path(s) for the results artifact (newline-separated for multi-module).
        type: string
        default: build/reports/tests/test
      upload-coverage:
        description: Upload the JaCoCo report to Codecov. Off for private repos that have no Codecov.
        type: boolean
        default: true
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for Claude attribution in history
        run: |
          if git log --all --format="%B" | grep -iE "^co-authored-by:[[:space:]]*claude|noreply@anthropic|generated (with|by)[[:space:]]*claude|🤖"; then
            echo "::error::Claude attribution found in git history — see CLAUDE.md commit standards."
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node # Prettier (web + config formatting) runs under Spotless
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Spotless check # ktlint for Kotlin/Java hygiene, Prettier for web + YAML/Markdown
        run: ./gradlew --no-daemon spotlessCheck

      # `build`, not `check`: a task outside the check graph is invisible to every gate in the
      # estate. stocks-analysis-us carried a fat-jar `jar` task that had never once succeeded —
      # it failed on a duplicate META-INF/DEPENDENCIES entry — while its badge stayed green,
      # because `check` does not depend on `jar`. `build` adds `assemble`, so packaging is gated
      # too rather than left to whoever remembers to run it.
      - name: Build, test, package, and enforce coverage
        run: ./gradlew --no-daemon clean build

      - name: Upload coverage to Codecov
        if: ${{ inputs.upload-coverage }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ inputs.coverage-report-files }}
          fail_ci_if_error: false

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: ${{ inputs.test-report-paths }}
          if-no-files-found: ignore
