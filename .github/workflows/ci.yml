name: CI

# Reusable CI pipeline for every buildable damian1000 repo. Callers reduce to a
# `uses:` one-liner and pass only what genuinely differs (coverage/report paths).
# Everything uniform — the Claude-attribution history gate, toolchain setup,
# Spotless, the coverage-gated build, Codecov, the test-report artifact — lives
# here, defined once.
on:
  workflow_call:
    inputs:
      coverage-report-files:
        description: Comma-separated JaCoCo XML report path(s) uploaded to Codecov.
        type: string
        default: build/reports/jacoco/test/jacocoTestReport.xml
      test-report-paths:
        description: Test HTML report path(s) for the results artifact (newline-separated for multi-module).
        type: string
        default: build/reports/tests/test
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Claude attribution in history
        run: |
          if git log --all --format="%B" | grep -iE "^co-authored-by:[[:space:]]*claude|noreply@anthropic|generated (with|by)[[:space:]]*claude|🤖"; then
            echo "::error::Claude attribution found in git history — see CLAUDE.md commit standards."
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node # Prettier (web + config formatting) runs under Spotless
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Spotless check # ktlint for Kotlin/Java hygiene, Prettier for web + YAML/Markdown
        run: ./gradlew --no-daemon spotlessCheck

      - name: Build, test, and enforce coverage
        run: ./gradlew --no-daemon clean check

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ inputs.coverage-report-files }}
          fail_ci_if_error: false

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ inputs.test-report-paths }}
          if-no-files-found: ignore
