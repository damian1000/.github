name: Dependency check

# Reusable OWASP dependency-check for every buildable damian1000 repo. Scheduled rather than
# run per pull request: the scan is only as current as the NVD feed it downloads, so it finds
# advisories published since the last build, not defects in the diff — dependency-review already
# gates pull requests on advisories in what the diff adds. A weekly run is what catches a CVE
# published against a dependency nobody touched.
on:
  workflow_call:
    inputs:
      task:
        description: Gradle task to run — dependencyCheckAggregate at a multi-module root.
        type: string
        default: dependencyCheckAnalyze
      report-paths:
        description: Report path(s) uploaded as the run artifact.
        type: string
        default: build/reports/dependency-check-report.html
    secrets:
      NVD_API_KEY:
        required: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Below the six-hour job ceiling, which GitHub reports as a cancelled run rather than a
    # failed one and therefore does not notify on. orderbook and risk-engine both hit it on
    # 2026-07-27 and reported nothing; a scan that has stopped running must say so.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail loudly rather than scanning without a key. Unauthenticated NVD callers get 5
      # requests per 30 seconds against 50 with a key, which turns an update into tens of
      # minutes and 403s — and a security scan that quietly degrades is worse than none.
      - name: Require an NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY is not set. Request a free key at https://nvd.nist.gov/developers/request-an-api-key and add it as a repository or organisation secret."
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # The local NVD copy is the expensive part: downloading it cold takes hours. The key is
      # unique per run so every run writes a fresh entry, and the prefix restore-key starts
      # each run from the newest previous copy and updates it incrementally.
      - name: Restore the NVD data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-

      - name: Scan dependencies
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # dependencyCheckAggregate calls Task.project at execution time, which the
        # configuration cache forbids; the repositories enable it by default. A one-off
        # scheduled scan gains nothing from a reused configuration anyway.
        # --no-parallel as well: the aggregate task resolves other projects'
        # runtimeClasspath, which Gradle rejects without an exclusive lock when the
        # repository enables parallel execution.
        run: ./gradlew --no-daemon --no-configuration-cache --no-parallel ${{ inputs.task }}

      # Saved on failure as well. actions/cache skips its save step when the job fails, so a
      # repository that failed the CVSS gate discarded the feed it had just spent hours
      # downloading and started cold again the next week — a 4h34m run in
      # kafka-streams-patterns on 2026-07-27, against one minute for a repository that hit
      # its cache. The finding is what should fail the run, not the cost of the next one.
      - name: Save the NVD data
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-report
          path: ${{ inputs.report-paths }}
          if-no-files-found: ignore
