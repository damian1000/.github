name: Dependency Review

# Reusable dependency-review gate (fails a PR on a high-severity advisory).
#
# The comparison is only as good as the dependency graph behind it, and until
# dependency-submission.yml existed that graph carried no JVM coordinates — this gate was
# reviewing npm packages and GitHub Actions on repositories whose dependencies are almost
# entirely Gradle. It now waits for the pull request's snapshot to arrive before deciding.
on:
  workflow_call:

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Both workflows start on the same `pull_request` event, so the review would
          # otherwise read a graph the submission job has not finished writing.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600
